name: Sync to HuggingFace Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

# A Space is a git repo; pushing to it replaces the served files. Let one push
# finish before the next starts rather than racing two force-pushes.
concurrency:
  group: hf-spaces
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Skip silently on forks and on repos where the secret was never added,
    # so a missing token is not a red X on every push.
    if: github.repository_owner == 'NagaYu'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        # Spaces serve from the root of the space subdomain, so unlike the
        # GitHub Pages job this build must carry no basePath.
        run: npm run build
        env:
          BASE_PATH: ''

      - name: Assemble the Space repo
        run: |
          set -euo pipefail
          rm -rf .hf && mkdir -p .hf
          cp -R out/. .hf/
          cp spaces/README.md .hf/README.md
          rm -f .hf/.nojekyll   # GitHub Pages marker, meaningless on Spaces

          if grep -q '/llama-local-lab/_next' .hf/index.html; then
            echo "::error::Build carries a basePath; Spaces serves from the root."
            exit 1
          fi

          # The Hub enforces limits on the Space card that its validate-yaml
          # endpoint does not, so a card can look valid right up until the
          # upload rejects it. Check the ones that bite here instead.
          python3 - <<'PY'
          import re, sys, yaml
          fm = re.match(r'^---\n(.*?)\n---\n', open('.hf/README.md').read(), re.S)
          if not fm:
              sys.exit('::error::.hf/README.md has no YAML frontmatter.')
          meta = yaml.safe_load(fm.group(1))
          for field, limit in (('short_description', 60), ('title', 100)):
              value = meta.get(field)
              if value and len(value) > limit:
                  sys.exit(f'::error::Space card "{field}" is {len(value)} chars; the Hub allows {limit}.')
          if meta.get('sdk') != 'static':
              sys.exit(f'::error::Space card sdk is {meta.get("sdk")!r}; this build only works as "static".')
          print('Space card metadata OK')
          PY

          echo "Assembled $(find .hf -type f | wc -l) files"

      - name: Install the HuggingFace CLI
        run: pip install --quiet --upgrade "huggingface_hub[cli]"

      - name: Verify the token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # Resolve the token to an account before uploading. A bad token fails
          # here with a readable message instead of surfacing as a git exit 128
          # from the push, which says nothing about why.
          if ! WHO="$(hf auth whoami 2>&1)"; then
            echo "::error::HF rejected the token. Create a new one with **write** scope at https://huggingface.co/settings/tokens and update the HF_TOKEN secret. Copy it with the copy button — a hand-typed token can pick up look-alike characters that are not ASCII."
            echo "$WHO"
            exit 1
          fi
          echo "Authenticated as: $WHO"

      - name: Upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_ID: YutaN13/llama-local-lab
        run: |
          set -euo pipefail
          # `hf upload` authenticates from HF_TOKEN directly. Pushing with git
          # over HTTPS needs the account name embedded in the URL as well, which
          # is an easy thing to get silently wrong; the CLI has no such trap.
          # Next.js hashes every chunk filename, so without a delete pass each
          # deploy would strand the previous build's assets in the Space and it
          # would grow without bound. Deletes and adds land in one commit, so
          # the paths being re-uploaded are never actually missing.
          hf upload "$SPACE_ID" .hf . \
            --repo-type space \
            --delete "_next/**" "style.css" \
            --commit-message "Sync from ${GITHUB_SHA::7}"

          echo "✓ https://huggingface.co/spaces/${SPACE_ID}"
